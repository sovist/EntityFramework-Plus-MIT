name: Build & Tests

on:
  push:
    branches: [ "master-MIT", "features/**" ]
  pull_request:
    branches: [ "master-MIT" ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # Windows, not Linux: upstream's test suite connects with `Server=localhost; Integrated Security=True`
    # (hard-coded in an upstream file this fork does not edit), which needs a local default instance and
    # Windows authentication.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install SQL Server
        uses: Potatoqualitee/mssqlsuite@v2
        with:
          install: sqlengine
          version: 2022

      - name: Build
        run: dotnet build src/EntityFramework.Plus.EFCore.MIT.slnf --configuration Release

      - name: Test
        run: dotnet test src/EntityFramework.Plus.EFCore.MIT.slnf --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Z.EntityFramework.Plus.EFCore10x.NET10/Z.EntityFramework.Plus.EFCore10x.NET10.csproj --configuration Release --no-build --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
